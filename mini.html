<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="mini_style.css">
        <script src="mini_script.js"></script>
    </head>
    <body>
        <h1 id="displayName">Loading Product...</h1>
        <div class="form-container">
            <label for="userName">Name</label>
            <input type="text" id="userName" placeholder="Full Name">
            <label for="userEmail">Email</label>
            <input type="email" id="userEmail" placeholder="email@example.com">
            <label for="userPhone">Phone</label>
            <input type="tel" id="userPhone" placeholder="98XXXXXXXX">
            <label for="province">Province</label>
            <select id="province">
                <option>Bagmati</option>
                <option>Gandaki</option>
                <option>Lumbini</option>
                <option>Koshi</option>
                <option>Madhesh</option>
                <option>Karnali</option>
                <option>Sudurpaschim</option>
            </select>
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Nearest landmark">
            <button class="confirm-btn" id="submitBtn" onclick="sendToDiscord()">Place Order</button>
        </div>
        <div id="successMessage" style="display: none; text-align: center; padding: 40px;">
            <h2 style="color: #27ae60;">✔ Order Placed!</h2>
            <p style="margin-top: 10px; color: #555;">We have received your request. Our team will contact you shortly.</p>
        </div>
    </body>
</html>
